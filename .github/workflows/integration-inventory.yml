name: Integration inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s tests -p integration_registration_test.py
      - run: python3 -B scripts/integration/coverage.py --check --output .test-artifacts/integration/ci-registration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-registration
          path: .test-artifacts/integration/
          include-hidden-files: true
