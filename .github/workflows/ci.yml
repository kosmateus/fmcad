name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Add lint/build/test jobs to ci-tests.yml so CI gate covers them automatically.
  pipeline:
    uses: ./.github/workflows/ci-tests.yml

  ci-gate:
    name: CI gate
    needs: pipeline
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: node --test tests/ci-gate.test.cjs
      - uses: actions/github-script@v7
        env:
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
        with:
          script: |
            const { checkRun } = require('./.github/scripts/ci-gate.cjs');
            await checkRun({ github, context, core, pipelineResult: process.env.PIPELINE_RESULT });
