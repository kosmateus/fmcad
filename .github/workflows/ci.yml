name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retire-unbounded-diagnostic-runs:
    if: github.event_name == 'push' && github.repository == 'kosmateus/fmcad' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # One-time migration: these two diagnostic runs predate concurrency limits.
      # Verify their commits before cancelling; no other workflow is touched.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for binding in 42364892587:8b2c237ec333d5b275c9f544bc729acd6109420a 42365353131:7ecc52a22e6ee61d5e7a07e2484d7d2d24d9a912; do
            run_id="${binding%%:*}"
            commit="${binding#*:}"
            observed="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha + ":" + .status')"
            if [ "$observed" = "$commit:in_progress" ] || [ "$observed" = "$commit:queued" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
            fi
          done

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check --end-of-line auto .github/workflows/ci.yml
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:tests
      - run: npm run test:scenarios:unit
      - run: npm run typecheck:simulator
      - run: node dist/tests/scenarios/verify-api.js
      - run: npm run test:scenarios:component -- --protocol mcp --owners 2
      - run: npm run test:scenarios:component -- --protocol addin --owners 2
      - run: npm run test:prepare-offline
      - run: timeout --signal=TERM --kill-after=15s 10m npm run test:contracts

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/python-requirements.txt
            tests/python-constraints.txt
            assets/*requirements.txt
      - run: python -m pip install -r tests/python-requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npm run test:python

  control-center-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:control-center:e2e
        env:
          FMCAD_CONTROL_CENTER_E2E_ARTIFACTS: .test-artifacts/control-center
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-browser
          path: .test-artifacts/control-center/
          include-hidden-files: true

  scenario-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        protocol: [mcp, addin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: timeout --signal=TERM --kill-after=15s 8m npm run test:scenarios:broker -- --protocol ${{ matrix.protocol }} --concurrency 10 --owners 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-broker-${{ matrix.protocol }}
          path: .test-artifacts/scenarios/
          include-hidden-files: true
