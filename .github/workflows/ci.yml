name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:prepare-offline
      - run: npm run test:broker-regressions

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx prettier --check --end-of-line auto .github/workflows/ci.yml
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:tests
      - run: npm run typecheck:simulator
      - run: node dist/tests/scenarios/verify-api.js
      - run: npm run test:scenarios:component -- --protocol mcp --owners 2 --suite foundation
      - run: npm run test:scenarios:component -- --protocol addin --owners 2 --suite foundation
      - run: npm run test:prepare-offline
      - run: mkdir -p /tmp/opencode
      - run: npm run test:contracts

  scenario-model:
    runs-on: ubuntu-24.04
    # Retained GM cases alone measured 690 seconds for one protocol before
    # checker integration. Keep this growing behavioral grid out of the
    # contracts job's 20-minute budget and avoid competing model processes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mkdir -p /tmp/opencode
      - run: npm run test:scenarios:unit

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/python-requirements.txt
            tests/python-constraints.txt
            assets/*requirements.txt
      - run: python -m pip install -r tests/python-requirements.txt
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:python

  control-center-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:control-center:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FMCAD_CONTROL_CENTER_E2E_ARTIFACTS: .test-artifacts/control-center
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-browser
          path: .test-artifacts/control-center/
          include-hidden-files: true

  scenario-broker:
    runs-on: ubuntu-24.04
    # Actual owned fixture populations are pinned to the required profile.
    # Preparation remains parallel and SDK work stays in the one broker lane.
    # Job budgets include build/cleanup; SDK deadlines and assertions are unchanged.
    timeout-minutes: ${{ matrix.suite.jobMinutes }}
    strategy:
      fail-fast: false
      matrix:
        protocol: [mcp, addin]
        concurrency: [1, 2, 10]
        suite:
          - { id: foundation, owners: 10, jobMinutes: 18 }
          - { id: saved, owners: 10, jobMinutes: 31 }
          - { id: parameters, owners: 3, jobMinutes: 36 }
          - { id: documents, owners: 4, jobMinutes: 41 }
          - { id: cloud, owners: 10, jobMinutes: 24 }
          - { id: boxes, owners: 5, jobMinutes: 24 }
          - { id: attributes, owners: 10, jobMinutes: 71 }
          - { id: sketches, owners: 10, jobMinutes: 66 }
          - { id: reopen, owners: 10, jobMinutes: 40 }
          - { id: revisions, owners: 10, jobMinutes: 46 }
          - { id: rectangles, owners: 10, jobMinutes: 64 }
          - { id: transactions, owners: 10, jobMinutes: 46 }
          - { id: camera, owners: 10, jobMinutes: 31 }
          - { id: poses, owners: 10, jobMinutes: 36 }
          - { id: animation, owners: 10, jobMinutes: 41 }
          - { id: materials, owners: 10, jobMinutes: 31 }
          - { id: appearances, owners: 10, jobMinutes: 31 }
          - { id: style-assignments, owners: 10, jobMinutes: 51 }
          - { id: thread-recipes, owners: 10, jobMinutes: 71 }
          - { id: gear-pair, owners: 10, jobMinutes: 51 }
          - { id: engineering-declarations, owners: 10, jobMinutes: 36 }
          - { id: mechanical-declarations, owners: 10, jobMinutes: 41 }
          - { id: retained-thread, owners: 2, jobMinutes: 51 }
          - { id: retained-seal, owners: 2, jobMinutes: 51 }
          - { id: retained-fasteners, owners: 1, jobMinutes: 51 }
          - { id: retained-mechanism, owners: 2, jobMinutes: 51 }
          - { id: retained-pose, owners: 2, jobMinutes: 51 }
          - { id: retained-interference, owners: 2, jobMinutes: 51 }
          - { id: retained-containment, owners: 2, jobMinutes: 51 }
          - { id: retained-gm-contracts, owners: 1, jobMinutes: 186 }
          - { id: retained-engineering, owners: 1, jobMinutes: 51 }
          - { id: child-cli, owners: 10, jobMinutes: 31 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Keep the complete MCP/addin × 1/2/10 grid for every family.
      - run: npm run test:scenarios:broker -- --protocol ${{ matrix.protocol }} --suite ${{ matrix.suite.id }} --concurrency ${{ matrix.concurrency }} --owners ${{ matrix.suite.owners }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-broker-${{ matrix.protocol }}-${{ matrix.suite.id }}-c${{ matrix.concurrency }}
          path: .test-artifacts/scenarios/
          include-hidden-files: true

  refactor-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:prepare-offline
      - run: npm run test:regressions

  modeling-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          set -o pipefail
          mkdir -p .test-artifacts/modeling
          npm run test:modeling:admission | tee .test-artifacts/modeling/admission.log
        env:
          FMCAD_MODELING_ADMISSION_SHARD: ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modeling-admission-${{ matrix.node }}-${{ matrix.shard }}
          path: .test-artifacts/modeling/
          include-hidden-files: true

  public-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/python-requirements.txt
            tests/python-constraints.txt
            assets/*requirements.txt
      - run: python -m pip install -r tests/python-requirements.txt
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:prepare-offline
      - run: npm run test:public-consumers
        env:
          FMCAD_REFERENCE_PYTHON: python3
          TERM: xterm
