# The extracted fmcad package graph; retained assets/cad shared-runtime
# composition remains covered by its separate source and composition guards.
[importlinter]
root_package = fmcad
include_external_packages = True
exclude_type_checking_imports = False

[importlinter:contract:production-layers]
name = Production package layers (adapters -> application -> ports -> domain)
type = layers
layers =
    fmcad.adapters
    fmcad.application
    fmcad.ports
    fmcad.domain

[importlinter:contract:domain-forbidden]
name = Domain modules do not depend on effects or the Fusion SDK
type = forbidden
source_modules =
    fmcad.domain
forbidden_modules =
    fmcad.adapters
    fmcad.application
    fmcad.ports
    adsk

[importlinter:contract:domain-acyclic]
name = Domain sibling modules remain acyclic
type = acyclic_siblings
ancestors = fmcad.domain
depth = 0
